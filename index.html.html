<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大会結果まとめ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 22px;
      margin-top: 20px;
    }
    .match {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }
    .match:last-child {
      border-bottom: none;
    }
    .team {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>大会名：○○杯</h1>
    <p>開催日：2025/xx/xx</p>
  </div>

  <div class="card">
    <h2>試合結果</h2>
    <div class="match">
      <span class="team">A高校</span> 3 - 1 <span class="team">B高校</span>
    </div>
    <div class="match">
      <span class="team">C高校</span> 4 - 2 <span class="team">D高校</span>
    </div>
  </div>

  <div class="card">
    <h2>個人成績</h2>
    <ul>
      <li>MVP：○○選手（A高校）</li>
      <li>得点王：△△選手（C高校）</li>
      <li>ベストプレー：□□選手（B高校）</li>
    </ul>
  </div>
</body>
</html>
